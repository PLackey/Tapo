# .NET MAUI CI/CD Pipeline for TapoMaui
# 
# 🚀 This pipeline is ENABLED for basic CI/CD
# 📱 Builds: Windows, Android on push/PR
# 💰 Cost: FREE for public repositories

name: "TapoMaui Build & Test"

# ✅ PIPELINE ENABLED - Triggers on push and PR
on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: [ main, develop ]
    paths:
      - 'TapoMaui/**'
      - '*.sln'
      - '.github/workflows/tapo-maui.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'TapoMaui/**'
      - '*.sln'
  release:
    types: [ created ]

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_PATH: './TapoMaui.sln'
  PROJECT_PATH: './TapoMaui/TapoMaui.csproj'

jobs:
  # ✅ BASIC CI/CD ENABLED - Build and test pipeline
  
  build-windows:
    name: "Build Windows"
    runs-on: windows-latest
    
    steps:
      - name: 🛒 Checkout Code
        uses: actions/checkout@v4
        
      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: 📦 Restore NuGet Packages
        run: dotnet restore ${{ env.SOLUTION_PATH }} --runtime win-x64
        
      - name: 🏗️ Build Solution  
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore --runtime win-x64 --framework net10.0-windows10.0.19041.0
        
      - name: 🧪 Run Tests (if any)
        run: dotnet test ${{ env.PROJECT_PATH }} --configuration Release --no-build --verbosity normal --framework net10.0-windows10.0.19041.0
        continue-on-error: true
        
      - name: 📦 Package Windows App
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} `
            --configuration Release `
            --framework net10.0-windows10.0.19041.0 `
            --runtime win-x64 `
            --self-contained true `
            --output ./publish/windows
            
      - name: 📤 Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tapo-maui-windows
          path: ./publish/windows
          retention-days: 7

  build-android:
    name: "Build Android"
    runs-on: windows-latest
    
    steps:
      - name: 🛒 Checkout Code
        uses: actions/checkout@v4
        
      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: 📦 Restore NuGet Packages
        run: dotnet restore ${{ env.SOLUTION_PATH }} --runtime android-arm64
        
      - name: 🏗️ Build Android APK
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} `
            --configuration Release `
            --framework net10.0-android `
            --runtime android-arm64 `
            --output ./publish/android
            
      - name: 📤 Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tapo-maui-android
          path: ./publish/android
          retention-days: 7

  # 🚀 RELEASE JOB (Creates GitHub Release)
  release:
    name: "Create Release"
    runs-on: ubuntu-latest
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: 📥 Download All Artifacts
        uses: actions/download-artifact@v4
        
      - name: 📦 Create Release Archives
        run: |
          zip -r tapo-maui-windows.zip tapo-maui-windows/
          zip -r tapo-maui-android.zip tapo-maui-android/
          
      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            tapo-maui-windows.zip
            tapo-maui-android.zip
          body: |
            ## 📱 TapoMaui Release ${{ github.ref_name }}
            
            ### 📦 Downloads:
            - **Windows**: `tapo-maui-windows.zip`
            - **Android**: `tapo-maui-android.zip` 
            
            ### 🎯 Features:
            - Native RTSP video streaming
            - Tapo camera discovery & control
            - Cross-platform .NET MAUI app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 🍎 iOS BUILD (Optional - requires macOS runner)
